# Nombre del workflow
name: build-and-save-artifact

# Ejecutar cuando se hace push o PR a la rama main
on:
    push:
        branches: ["react"]
    pull_request:
        branches: ["react"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # Clonar el repo
            - name: Clone repository
              uses: actions/checkout@v4

            # Instalar nodejs. También puede ser java, dotnet...
            - name: Set up Node.js v20.x
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  # cache necesita un archivo 'package-lock.json' para funcionar
                  # cache: 'npm'

            # 'npm ci' necesita un archivo 'package-lock.json', de otro modo usar 'npm install'
            - name: 📦 Install dependencies
              run: npm install

            - name: 🔨 Build
              run: npm run build

            - name: 🧪 Run tests
              run: npm test -- --passWithNoTests

            - name: 📦 Archive build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifact
                  # 'build' para CRA, 'dist' para Vite, 'out' para Next.js.
                  path: build
                  retention-days: 90
